name: Code Explainer Bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  run-agent:
    if: |
      contains(github.event.comment.body, '@gitagent explain') ||
      contains(github.event.comment.body, '@gitagent test')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install agent dependencies
        run: |
          npm install @octokit/rest

      - name: Run agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          node -e "
          import('./index.js').then(m => m.run(${{ toJson(github.event) }})).catch(e => { console.error(e); process.exit(1); })
          "
